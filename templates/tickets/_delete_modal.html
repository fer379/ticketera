<div class="modal fade" id="deleteTicketModal" tabindex="-1" aria-labelledby="delete-ticket-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="delete-ticket-title">Eliminar ticket</h2>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p>¿Estás seguro de que querés eliminar este ticket?</p>
        <p class="fw-semibold mb-2" id="delete-ticket-label"></p>
        <p class="small text-muted mb-0">Esta acción es permanente y no se puede deshacer.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <form id="delete-ticket-form" method="post" action="{{ url_for('ticket_delete', ticket_id=0) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button id="confirm-delete-ticket" type="submit" class="btn btn-danger" disabled>Sí, eliminar</button>
        </form>
      </div>
    </div>
  </div>
</div>
