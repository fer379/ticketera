{% extends "base.html" %}
{% block title %}Nuevo Ticket{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white">
        <h5 class="mb-0">Crear Nuevo Ticket de Soporte</h5>
      </div>
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Título del incidente / solicitud</label>
            <input type="text" name="title" class="form-control" maxlength="150" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Categoría</label>
              <select name="category" class="form-select">
                <option>Soporte General</option>
                <option>Redes y Permisos</option>
                <option>Hardware</option>
                <option>Software / Aplicaciones</option>
                <option>Seguridad / VPN</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Prioridad</label>
              <select name="priority" class="form-select">
                {% for pr in priorities %}
                  <option value="{{ pr }}" {% if pr == 'Media' %}selected{% endif %}>{{ pr }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Descripción detallada</label>
            <textarea name="description" rows="4" class="form-control" required></textarea>
          </div>
          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('tickets_list') }}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Registrar Ticket</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
